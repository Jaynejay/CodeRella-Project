# === Application Info ===
spring.application.name=coderellaProject

# === DataSource ===
spring.datasource.url=jdbc:mysql://localhost:3306/coderella_db
spring.datasource.username=root
spring.datasource.password=Mysqlring123#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === Logging (Optional) ===
logging.level.org.hibernate.tool.hbm2ddl=TRACE
logging.level.org.springframework.web=DEBUG

# === JWT Secret ===
jwt.secret=myverysecurejwtsecretkey1234567890

# === Mail Configuration ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
