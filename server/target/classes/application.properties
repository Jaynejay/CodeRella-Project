# ========== APP CONFIG ==========
spring.application.name=coderella
server.port=8080

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========== DATABASE CONFIG ==========
spring.datasource.url=jdbc:mysql://localhost:3306/coderella?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=Coderella
spring.datasource.password=KjM2000@1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========== VALIDATION ==========
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ========== LOGGING ==========
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.tool.hbm2ddl=TRACE

# ========== JWT SECRET ==========
