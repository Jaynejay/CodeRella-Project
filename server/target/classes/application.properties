# application.properties

spring.application.name=coderellaProject

# ==== DataSource ====
spring.datasource.url=jdbc:mysql://localhost:3306/coderella?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=Coderella
spring.datasource.password=KjM2000@1
# (optional, but can help if Spring can?t pick up the driver)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# explicitly set dialect for MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# (optional logging)
logging.level.org.hibernate.tool.hbm2ddl=TRACE
logging.level.org.springframework.web=DEBUG
